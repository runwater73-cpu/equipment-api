# Metadata for Equipment Structure API.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="equipment_structure_api.mixins.json"

[[mixins]]
config="equipment_structure_api.curios.mixins.json"

[[mixins]]
config="equipment_structure_api.lifecycle.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="RunWater1"
description='''
A standalone API for defining modular equipment structure, component slots, and typed interfaces.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[9.5.1,9.6)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
