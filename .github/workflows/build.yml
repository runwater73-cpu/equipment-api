name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: equipment-structure-api
          path: build/libs/*.jar
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PincludeGameTests=true runGameTestServer --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: game-test-logs
          path: run-gametest/logs/
